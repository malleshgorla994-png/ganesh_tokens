{% extends "base.html" %}
{% block title %}Token Registration{% endblock %}
{% block body %}
<section class="card">
  <div class="card-top">
    <img class="logo" src="{{ url_for('logo') }}" alt="{{ org_name }}">
    <p class="org">{{ org_name }}</p>
    <h1>Token Registration</h1>
    <p class="tagline">Fill in your details below to get your token number.</p>
  </div>
  <div class="perforation"></div>
  <div class="card-body">
    {% if error %}
      <p class="form-error">{{ error }}</p>
    {% endif %}
    <form method="post" action="{{ url_for('submit') }}">
      <div class="field">
        <label for="name">Name</label>
        <input id="name" name="name" type="text" autocomplete="name" placeholder="Your full name" value="{{ name or '' }}">
      </div>
      <div class="field">
        <label for="phone">Phone number</label>
        <input id="phone" name="phone" type="tel" autocomplete="tel" placeholder="10-digit mobile number" inputmode="numeric" value="{{ phone or '' }}">
      </div>
      <button class="primary" type="submit">Get my token</button>
    </form>
  </div>
</section>
{% endblock %}
