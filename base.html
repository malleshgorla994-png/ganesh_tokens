<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Token Registration{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap">
<style>
  :root{
    --bg:#faf5ec;
    --surface:#ffffff;
    --surface-2:#fdf9f0;
    --ink:#2a1f1a;
    --ink-muted:#6b5d52;
    --line:#e6dac7;
    --accent:#7a1414;
    --accent-deep:#5c1010;
    --gold:#b8863a;
    --danger:#a23b2e;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    padding:32px 16px 56px;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  .card{
    width:100%;
    max-width:440px;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:18px;
    box-shadow:0 18px 40px -20px rgba(42,31,26,0.35);
    overflow:hidden;
  }
  .card-top{
    padding:30px 32px 22px;
    text-align:center;
  }
  .logo{
    width:84px;
    height:84px;
    border-radius:50%;
    object-fit:cover;
    border:3px solid var(--gold);
    margin-bottom:14px;
  }
  h1{
    font-family:'Fraunces',serif;
    font-weight:700;
    font-size:22px;
    margin:0 0 4px;
  }
  .org{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:13px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--accent);
    margin:0 0 6px;
  }
  .tagline{
    font-size:13.5px;
    color:var(--ink-muted);
    margin:0;
  }
  .perforation{
    position:relative;
    height:0;
    border-top:2px dashed var(--line);
    margin:0 24px;
  }
  .perforation::before,.perforation::after{
    content:"";
    position:absolute;
    top:-11px;
    width:22px;
    height:22px;
    border-radius:50%;
    background:var(--bg);
    border:1px solid var(--line);
  }
  .perforation::before{left:-35px;}
  .perforation::after{right:-35px;}
  .card-body{
    padding:26px 32px 30px;
  }
  .field{margin-bottom:16px;}
  .field label{
    display:block;
    font-size:12.5px;
    font-weight:600;
    letter-spacing:0.04em;
    text-transform:uppercase;
    color:var(--ink-muted);
    margin-bottom:6px;
  }
  .field input{
    width:100%;
    padding:11px 13px;
    border-radius:10px;
    border:1px solid var(--line);
    background:var(--surface-2);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    font-size:15px;
  }
  .field input:focus{outline:2px solid var(--accent);outline-offset:1px;}
  button.primary,a.primary{
    display:block;
    width:100%;
    padding:13px;
    border-radius:10px;
    border:none;
    background:var(--accent);
    color:#fff;
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:15px;
    cursor:pointer;
    text-align:center;
    text-decoration:none;
    margin-top:6px;
  }
  button.primary:hover,a.primary:hover{background:var(--accent-deep);}
  a.secondary{
    display:block;
    width:100%;
    padding:12px;
    border-radius:10px;
    border:1px solid var(--line);
    background:transparent;
    color:var(--ink);
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:14.5px;
    cursor:pointer;
    text-align:center;
    text-decoration:none;
    margin-top:10px;
    box-sizing:border-box;
  }
  a.secondary:hover{border-color:var(--accent);color:var(--accent);}
  .form-error{
    font-size:13px;
    color:var(--danger);
    text-align:center;
    margin:0 0 14px;
  }
  .badge{
    width:88px;
    height:88px;
    border-radius:50%;
    background:var(--accent);
    color:#fff;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    margin:0 auto 16px;
  }
  .badge .no-label{font-size:9px;letter-spacing:0.12em;text-transform:uppercase;opacity:0.85;}
  .badge .no-value{font-family:'Fraunces',serif;font-weight:700;font-size:28px;line-height:1;}
  .receipt-title{
    font-family:'Fraunces',serif;
    font-weight:700;
    font-size:19px;
    margin:0 0 18px;
    text-align:center;
  }
  .receipt-rows{
    text-align:left;
    border-top:1px solid var(--line);
    padding-top:14px;
  }
  .receipt-row{
    display:flex;
    justify-content:space-between;
    gap:12px;
    padding:8px 0;
    border-bottom:1px solid var(--line);
    font-size:14.5px;
  }
  .receipt-row:last-child{border-bottom:none;}
  .receipt-row .k{color:var(--ink-muted);}
  .receipt-row .v{font-weight:600;text-align:right;}
  .receipt-image{
    width:100%;
    border-radius:10px;
    border:1px solid var(--line);
    margin-top:18px;
  }
  .footnote{
    text-align:center;
    font-size:12.5px;
    font-style:italic;
    color:var(--ink-muted);
    margin-top:36px;
  }
  @media (max-width:480px){
    .card-top,.card-body{padding-left:20px;padding-right:20px;}
  }
</style>
</head>
<body>
{% block body %}{% endblock %}
<p class="footnote">Please keep your token number safe &mdash; you'll need it at the counter.</p>
</body>
</html>
